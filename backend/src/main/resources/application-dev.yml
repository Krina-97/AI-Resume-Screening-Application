# Optional H2 profile — activate with SPRING_PROFILES_ACTIVE=dev
# File-based H2 under user home; use only when MySQL is not available.
spring:
  datasource:
    url: jdbc:h2:file:${user.home}/ai-resume-screening/h2-data/ai_resume_screening;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
