# Local dev without MySQL — use: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# (dev profile is active by default in application.yml)
spring:
  datasource:
    url: jdbc:h2:mem:ai_resume_screening;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
